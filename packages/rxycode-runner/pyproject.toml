[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rxycode-runner"
version = "1.4.3"
description = "Local runner for rxycode connect"
requires-python = ">=3.10"
dependencies = ["websockets"]

[project.scripts]
rxycode-connect = "rxycode_runner.desktop.capabilities:connect_main"

[tool.setuptools.packages.find]
where = ["src"]
