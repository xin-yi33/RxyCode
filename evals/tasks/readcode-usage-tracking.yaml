id: readcode-usage-tracking
category: readcode
prompt: |
  阅读当前仓库的 core/agent_v2.py 中的 UsageTrackingLLM 类，回答：它包装了哪些 LLM 调用方法
  （至少说出 ainvoke 和 astream）？token 用量是通过哪个函数记录到 token_stats 的？
  bind_tools 返回的新实例为什么要重新包装？
checks:
  - type: output_contains
    pattern: "UsageTrackingLLM"
  - type: output_contains
    pattern: "ainvoke"
  - type: output_contains
    pattern: "astream"
  - type: output_contains
    pattern: "_record_usage"
  - type: output_contains
    pattern: "bind_tools"
