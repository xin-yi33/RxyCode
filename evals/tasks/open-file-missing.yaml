id: open-file-missing
category: feature
effect: write
prompt: |
  请用 open_file 打开当前目录下这个不存在的文件：open_e2e_missing_no_such_file.docx。
  把工具返回的错误原文写进最终回答，然后结束。不要静默重试超过两次，不要等窗口出现。
  重要：所有文件必须创建/修改在【当前工作目录】内；禁止把文件写入仓库目录，也禁止使用仓库内文件的绝对路径。
setup:
  files:
    .keep: ""
checks:
  - type: tool_used
    tool: open_file
  - type: output_contains
    pattern: "error"
