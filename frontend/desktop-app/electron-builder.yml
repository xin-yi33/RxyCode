appId: com.rxycode.desktop
productName: RxyCode Desktop
directories:
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - '!**/node_modules/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - scripts/**
extraResources:
  - from: build/runtime
    to: runtime
  - from: src/i18n/locales
    to: locales
afterAllArtifactBuild: scripts/wrap-win-zip.cjs
win:
  executableName: rxycode-desktop
  artifactName: RxyCode.Desktop-${version}-win.${ext}
  target:
    - nsis        # 综合 Release：安装版（默认装到 ~/.rxycode/desktop，可自定义路径，桌面快捷方式默认开启可取消）
    - zip         # 便携包 Release：解压即用，无安装器、无快捷方式
nsis:
  artifactName: rxycode-desktop-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
    - zh_CN
  include: build/installer.nsh
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: rxycode-desktop-${version}.${ext}
linux:
  executableName: rxycode-desktop
  target:
    - AppImage
    - deb
  maintainer: RxyCode
  category: Utility
appImage:
  artifactName: rxycode-desktop-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates