[pytest]
testpaths = tests
python_files = test_*.py *_test.py
addopts = -ra --strict-markers
asyncio_mode = auto
timeout = 180
markers =
    unit: fast tests for pure logic and state transitions
    integration: tests that cross production module boundaries with scripted dependencies
    contract: API, SSE, approval, and protocol compatibility tests
    system: subprocess and real local runtime tests
    live: opt-in tests that may call real providers or the public internet
    pty: terminal tests that require a PTY or Windows ConPTY
    serial: tests that mutate process-wide state and must not run concurrently
