[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rxycode"
version = "1.2.4"
description = "Plan-and-execute AI coding agent with verification and safe tool orchestration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "RxyCode contributors" },
]
keywords = ["agent", "coding-assistant", "langgraph", "plan-and-execute"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]
dynamic = ["dependencies"]

[project.scripts]
rxycode = "RxyCode.RxyCode1_1_0.entrypoint:main"

[project.urls]
Homepage = "https://github.com/xin-yi33/RxyCode"
Repository = "https://github.com/xin-yi33/RxyCode.git"
Issues = "https://github.com/xin-yi33/RxyCode/issues"
Changelog = "https://github.com/xin-yi33/RxyCode/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = false
packages = [
  "RxyCode",
  "RxyCode.RxyCode1_1_0",
  "RxyCode.RxyCode1_1_0.cache",
  "RxyCode.RxyCode1_1_0.config",
  "RxyCode.RxyCode1_1_0.core",
  "RxyCode.RxyCode1_1_0.core.prompts",
  "RxyCode.RxyCode1_1_0.core.safety",
  "RxyCode.RxyCode1_1_0.protocol",
  "RxyCode.RxyCode1_1_0.evals",
  "RxyCode.RxyCode1_1_0.execution",
  "RxyCode.RxyCode1_1_0.history",
  "RxyCode.RxyCode1_1_0.log",
  "RxyCode.RxyCode1_1_0.lsp",
  "RxyCode.RxyCode1_1_0.mcp",
  "RxyCode.RxyCode1_1_0.memory",
  "RxyCode.RxyCode1_1_0.planning",
  "RxyCode.RxyCode1_1_0.rag",
  "RxyCode.RxyCode1_1_0.recovery",
  "RxyCode.RxyCode1_1_0.scheduler",
  "RxyCode.RxyCode1_1_0.synthesis",
  "RxyCode.RxyCode1_1_0.tools",
  "RxyCode.RxyCode1_1_0.utils",
  "RxyCode.RxyCode1_1_0.validation",
]

[tool.setuptools.package-dir]
"RxyCode" = "_package_root/RxyCode"
"RxyCode.RxyCode1_1_0" = "."

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
"RxyCode.RxyCode1_1_0" = [
  "frontend/package.json",
  "frontend/dist/*.js",
  "frontend/opentui-app/package.json",
  "frontend/opentui-app/tsconfig.json",
  "frontend/opentui-app/bun.lock",
  "frontend/opentui-app/src/**/*",
]
"RxyCode.RxyCode1_1_0.evals" = ["tasks/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".venv",
  "_package_root",
  "frontend",
  "build",
  "dist",
  "artifacts",
]

[tool.ruff.lint]
# 起步集：只开"几乎不会误报、且能抓真 bug"的规则。
# 风格类（I 排序、UP 升级语法）等 CI 绿了之后再逐条开，见 §9.5。
select = [
  "E9",    # 语法错误 / IO 错误
  "F",     # pyflakes：未定义名字、未使用 import、f-string 缺占位符
  "B",     # flake8-bugbear：可变默认参数、循环变量绑定等真 bug
  "W605",  # 无效转义序列
]
ignore = [
  "B008",  # FastAPI 的 Depends() 默认参数是标准写法
  "B905",  # zip(strict=) 需要 3.10+，逐步迁移
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401"]        # fixture 重定义 / 显式 re-export
"**/__init__.py" = ["F401"]         # 包级 re-export

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
